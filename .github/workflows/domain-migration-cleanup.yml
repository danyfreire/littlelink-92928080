name: One-time domain migration cleanup

on:
  push:
    paths:
      - '.github/workflows/domain-migration-cleanup.yml'

permissions:
  contents: write

jobs:
  migrate-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update domain references and site metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import html

          root = Path('.')
          text_exts = {'.html', '.htm', '.xml', '.txt', '.json', '.js', '.css', '.md', '.yml', '.yaml'}
          skip_dirs = {'.git'}

          replacements = [
              ('https://www.92928080.xyz', 'https://palozebra.com'),
              ('http://www.92928080.xyz', 'https://palozebra.com'),
              ('https://92928080.xyz', 'https://palozebra.com'),
              ('http://92928080.xyz', 'https://palozebra.com'),
              ('https://www.23788080.xyz', 'https://palozebra.com'),
              ('http://www.23788080.xyz', 'https://palozebra.com'),
              ('https://23788080.xyz', 'https://palozebra.com'),
              ('http://23788080.xyz', 'https://palozebra.com'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in text_exts and path.name not in {'robots.txt', 'CNAME'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Homepage: canonical/OG cleanup, local vCard URL, current copyright.
          index_path = Path('index.html')
          if index_path.exists():
              text = index_path.read_text(encoding='utf-8')
              text = text.replace('href="https://palozebra.com/files/danyfreire.vcf"', 'href="/files/danyfreire.vcf"')
              text = text.replace('© 2025 Palozebra', '© 2026 Palozebra')
              if 'property="og:url"' not in text:
                  marker = '<meta property="og:locale:alternate" content="en_US" />'
                  addition = '''<meta property="og:type" content="website" />\n    <meta property="og:title" content="Palozebra | Diseño, Web & Audio" />\n    <meta property="og:description" content="Palozebra es un estudio creativo en Guayaquil, Ecuador, enfocado en diseño, música, web y marketing digital." />\n    <meta property="og:url" content="https://palozebra.com/" />\n    <meta property="og:image" content="https://palozebra.com/images/avatar@2x.png" />'''
                  if marker in text:
                      text = text.replace(marker, marker + '\n    \n    ' + addition)
              index_path.write_text(text, encoding='utf-8')

          # Remove team links that point to pages that do not exist.
          teams_path = Path('mundial-2026-selecciones/index.html')
          if teams_path.exists():
              text = teams_path.read_text(encoding='utf-8')
              def keep_or_remove(match):
                  href = match.group(1)
                  target = Path(href.strip('/')) / 'index.html'
                  return match.group(0) if target.exists() else ''
              text = re.sub(r'\s*<li><a href="(/seleccion-[^"]+/)">.*?</a></li>', keep_or_remove, text)
              teams_path.write_text(text, encoding='utf-8')

          # Replace the untouched LittleLink sample privacy page with a Palozebra-specific notice.
          privacy = '''<!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Política de privacidad | Palozebra</title>
            <meta name="description" content="Información de privacidad y servicios de terceros utilizados por Palozebra.">
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="https://palozebra.com/privacy.html">
            <link rel="icon" type="image/x-icon" href="/images/avatar.png">
            <link rel="stylesheet" href="css/reset.css">
            <link rel="stylesheet" href="css/style.css">
            <link rel="stylesheet" href="css/brands.css">
          </head>
          <body>
            <div class="container-left" role="main">
              <div class="column">
                <nav role="navigation"><a href="/">← Volver a Palozebra</a></nav>
                <h1>Política de privacidad</h1>
                <p>Palozebra es un sitio informativo y de portafolio. No requiere crear una cuenta ni solicita datos sensibles directamente desde el sitio.</p>
                <h2>Servicios de terceros</h2>
                <p>Algunas páginas pueden integrar o enlazar servicios de terceros, entre ellos Google AdSense, Amazon Associates, Spotify, WhatsApp y otras plataformas externas. Esos servicios pueden procesar datos de uso, cookies u otra información de acuerdo con sus propias políticas de privacidad.</p>
                <h2>Contacto</h2>
                <p>Si nos escribes por correo electrónico o WhatsApp, la información que compartas será tratada a través de esos servicios únicamente para responder a tu comunicación.</p>
                <h2>Enlaces externos</h2>
                <p>Palozebra contiene enlaces a sitios de terceros. Sus prácticas de privacidad y contenido son responsabilidad de cada proveedor.</p>
                <h2>Consultas</h2>
                <p>Para consultas relacionadas con privacidad puedes escribir a <a href="mailto:dany.freire.b@gmail.com">dany.freire.b@gmail.com</a>.</p>
                <footer><p>© 2026 Palozebra</p></footer>
              </div>
            </div>
          </body>
          </html>
          '''
          Path('privacy.html').write_text(privacy, encoding='utf-8')

          # Keep robots simple and point it to the new canonical sitemap.
          Path('robots.txt').write_text(
              'User-agent: *\nAllow: /\n\nSitemap: https://palozebra.com/sitemap.xml\n',
              encoding='utf-8'
          )

          # Build sitemap from the live homepage and existing World Cup SEO pages only.
          urls = [('https://palozebra.com/', '1.0')]
          candidates = []
          for pattern in ('mundial-*/index.html', 'seleccion-*/index.html'):
              candidates.extend(root.glob(pattern))
          for path in sorted(set(candidates), key=lambda p: str(p)):
              rel = path.parent.as_posix().strip('/')
              urls.append((f'https://palozebra.com/{rel}/', '0.8'))

          sitemap_lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for loc, priority in urls:
              sitemap_lines.extend([
                  '  <url>',
                  f'    <loc>{html.escape(loc)}</loc>',
                  '    <lastmod>2026-08-12</lastmod>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ])
          sitemap_lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(sitemap_lines) + '\n', encoding='utf-8')

          # This workflow is intentionally one-shot: remove it from the resulting cleanup commit.
          Path('.github/workflows/domain-migration-cleanup.yml').unlink(missing_ok=True)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: finish migration to palozebra.com"
          git push
